---
# cPanel Git Version Control — deployment tasks
#
# Recommended layout:
#   Clone path:  ~/repositories/ozermanltd.com  (or cPanel Git default)
#   Deploy path: ~/ozermanltd.com
#   Document root (Domains → domain → Document Root): ~/ozermanltd.com/public
#
# Do not clone the repo into public_html itself.
# Preserve production .env and public/uploads across deploys (not overwritten below).
# See docs/PRODUCTION-LAUNCH.md
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/ozermanltd.com
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/public
    - /bin/mkdir -p $DEPLOYPATH/storage/logs
    - /bin/mkdir -p $DEPLOYPATH/storage/admin/rate_limits
    - /bin/mkdir -p $DEPLOYPATH/storage/analytics
    - /bin/mkdir -p $DEPLOYPATH/public/uploads
    - /bin/cp -R app $DEPLOYPATH/
    - /bin/cp -R bin $DEPLOYPATH/
    - /bin/cp -R config $DEPLOYPATH/
    - /bin/cp -R database $DEPLOYPATH/
    - /bin/cp -R docs $DEPLOYPATH/
    - /bin/cp -R modules $DEPLOYPATH/
    - /bin/cp -R resources $DEPLOYPATH/
    - /bin/cp -R routes $DEPLOYPATH/
    - /bin/cp -R scripts $DEPLOYPATH/
    - /bin/cp bootstrap.php $DEPLOYPATH/
    - /bin/cp Makefile $DEPLOYPATH/
    - /bin/cp README.md $DEPLOYPATH/
    - /bin/cp .env.example $DEPLOYPATH/
    - /bin/cp tailwind.config.js $DEPLOYPATH/
    - /bin/cp -R public/assets $DEPLOYPATH/public/
    - /bin/cp public/index.php $DEPLOYPATH/public/
    - /bin/cp public/router.php $DEPLOYPATH/public/
    - /bin/cp public/.htaccess $DEPLOYPATH/public/
    - /bin/cp public/robots.txt $DEPLOYPATH/public/
    - /bin/cp public/uploads/.htaccess $DEPLOYPATH/public/uploads/
    - /bin/cp public/uploads/.gitkeep $DEPLOYPATH/public/uploads/
    - /bin/cp -R storage/seo $DEPLOYPATH/storage/
    - /bin/cp storage/logs/.gitkeep $DEPLOYPATH/storage/logs/
    - /bin/cp storage/analytics/.gitkeep $DEPLOYPATH/storage/analytics/
    - /bin/cp storage/admin/rate_limits/.gitkeep $DEPLOYPATH/storage/admin/rate_limits/
    - /bin/chmod -R u+rwX $DEPLOYPATH/storage
    - /bin/chmod -R u+rwX $DEPLOYPATH/public/uploads
    - if [ ! -f $DEPLOYPATH/.env ]; then /bin/cp $DEPLOYPATH/.env.example $DEPLOYPATH/.env; fi
